# 目标路径: /etc/sysctl.d/99-bbr-fq.conf  (0644)
#
# 开启 TCP BBR 拥塞控制与 fq 公平发包队列。
# 注意：写入后执行 `sysctl --system` 只会让新参数进入内核默认值，**不会**自动替换
# 当前活动物理网卡（如 eth0 / ens7）上已挂载的旧根队列（常见为 pfifo_fast）。
# 必须配合 `tc qdisc replace dev <默认出口网卡> root fq` 当场切换并回读确认。
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
